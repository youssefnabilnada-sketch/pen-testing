name: local-core-quality
on: [push, pull_request]
permissions:
  contents: read
# Only the newest push on a branch needs the full release gate. Prevent
# superseded CI runs from consuming credits or delaying current evidence.
concurrency:
  group: aegis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r apps/api/requirements-dev.txt -r apps/api/requirements-firebase.txt
      - run: pytest --cov=aegis --cov-fail-under=85 --junitxml=docs/testing/ci-backend.xml
      - run: ruff check apps/api tests
      - run: alembic -c apps/api/alembic.ini upgrade head
        env: {DATABASE_URL: 'sqlite:///ci-migration.db'}
      - run: alembic -c apps/api/alembic.ini check
        env: {DATABASE_URL: 'sqlite:///ci-migration.db'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-results, path: docs/testing/ci-backend.xml}
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: aegis, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: aegis}
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U aegis" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://aegis:ci-only-password@localhost:5432/aegis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r apps/api/requirements.txt
      - run: alembic -c apps/api/alembic.ini upgrade head
      - run: alembic -c apps/api/alembic.ini check
      # Disposable CI database only. Verify the three unproven PostgreSQL
      # migrations can be reversed and applied again without losing schema.
      - name: Verify PostgreSQL migrations 014-017 round-trip
        run: |
          alembic -c apps/api/alembic.ini downgrade 013_agency
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini check
      - name: Assert PostgreSQL migration head and latest tables
        run: |
          python - <<'PYPOSTGRES'
          import os
          from sqlalchemy import create_engine, inspect, text
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              revision = conn.execute(text('select version_num from alembic_version')).scalar_one()
          assert revision == '017_evidence_legal_holds', revision
          tables = set(inspect(engine).get_table_names())
          required = {'alert_subscriptions', 'email_deliveries', 'patch_backups', 'leads', 'evidence_seals', 'evidence_legal_holds'}
          assert not (required - tables), f'Missing tables: {sorted(required - tables)}'
          print('PostgreSQL migrations 014-017: schema present after round-trip')
          PYPOSTGRES
      - name: Rehearse backup and restore with disposable synthetic data
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i -e AEGIS_DISPOSABLE_RESTORE=ci-fixture-only "$POSTGRES_CONTAINER" sh < scripts/ci-postgres-restore.sh

  integrated-postgres-redis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: aegis, POSTGRES_PASSWORD: isolated-ci-only, POSTGRES_DB: aegis_ci}
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U aegis -d aegis_ci" --health-interval=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      AEGIS_ISOLATED_TEST_DATABASE_URL: postgresql+psycopg://aegis:isolated-ci-only@127.0.0.1:5432/aegis_ci
      AEGIS_TEST_BROKER_URL: redis://127.0.0.1:6379/15
      AEGIS_TEST_REDIS_URL: redis://127.0.0.1:6379/14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r apps/api/requirements-dev.txt -r apps/api/requirements-firebase.txt
      - name: Integrated authorization, Cloudflare and AutoFix recovery regressions
        run: |
          pytest tests/test_customer_journey.py tests/test_repositories.py \
            tests/test_redis_connections.py tests/test_smtp_delivery.py \
            tests/test_cloudflare_smartverify_api.py tests/test_autofix_recovery.py \
            tests/test_smartverify.py tests/test_staging_evidence_unit.py \
            -q --junitxml=docs/testing/integrated-runtime.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: integrated-runtime-results, path: docs/testing/integrated-runtime.xml}
  browser-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install -r apps/api/requirements-dev.txt -r apps/api/requirements-firebase.txt
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Real desktop/mobile browser Health journey (isolated owned fixture)
        env: {AEGIS_HEALTH_BROWSER: '1'}
        run: pytest tests/test_health_browser.py -q --junitxml=docs/testing/ci-health-browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: health-browser-results, path: docs/testing/ci-health-browser.xml}
  native-runtime:
    # Real isolated Next + FastAPI + Celery worker + PostgreSQL + Redis + owned loopback SMTP.
    # No real customer data, external target or production service is contacted.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: aegis, POSTGRES_PASSWORD: isolated-ci-only, POSTGRES_DB: aegis_ci}
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U aegis -d aegis_ci" --health-interval=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      AEGIS_ISOLATED_TEST_DATABASE_URL: postgresql+psycopg://aegis:isolated-ci-only@127.0.0.1:5432/aegis_ci
      AEGIS_TEST_BROKER_URL: redis://127.0.0.1:6379/15
      AEGIS_TEST_REDIS_URL: redis://127.0.0.1:6379/14
      REDIS_URL: redis://127.0.0.1:6379/15
      AEGIS_NATIVE_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install -r apps/api/requirements-dev.txt -r apps/api/requirements-firebase.txt
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - name: Verify actual separate-process service integration
        run: pytest tests/test_native_runtime.py -q --junitxml=docs/testing/ci-native-runtime.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: native-runtime-evidence, path: docs/testing/ci-native-runtime.xml}
  browser-smoke:
    # Explicit desktop + mobile browser smoke acceptance of the production build.
    # This does NOT replace authenticated scan/AutoFix or live cloud journeys.
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start Next production server and confirm readiness
        run: |
          set -euo pipefail
          nohup npm run start > "$RUNNER_TEMP/aegis-next.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/aegis-next.log"
          exit 1
      - name: Verify real Chromium desktop and mobile landing journeys
        env: {E2E_BASE_URL: 'http://127.0.0.1:3000'}
        run: npx playwright test e2e/smoke.spec.ts --project=desktop --project=mobile --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-smoke-evidence, path: apps/web/test-results/}
  wordpress-runtime:
    # Real, isolated WordPress bootstrap; does not touch a customer's WordPress site.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: aegis_wp_ci
          MYSQL_USER: aegis_ci
          MYSQL_PASSWORD: ci-fixture-password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=10s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, mbstring
          coverage: none
      - name: WordPress plugin contract and syntax
        run: |
          php -l integrations/wordpress/aegis-verify/aegis-verify.php
          php tests/wordpress_contract.php
      - name: Prepare isolated official WordPress runtime
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/aegis-wordpress"
          mkdir -p "$root"
          curl --fail --silent --show-error --location --retry 3 https://wordpress.org/latest.tar.gz -o "$RUNNER_TEMP/wordpress.tar.gz"
          tar -xzf "$RUNNER_TEMP/wordpress.tar.gz" --strip-components=1 -C "$root"
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$RUNNER_TEMP/wp-cli.phar"
          wp() { php "$RUNNER_TEMP/wp-cli.phar" --path="$root" "$@"; }
          wp config create --dbname=aegis_wp_ci --dbuser=aegis_ci --dbpass=ci-fixture-password --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_DEBUG true --raw
          wp config set WP_DEBUG_LOG true --raw
          wp core install --url=https://owned.example --title='AEGIS owned WordPress fixture' --admin_user=aegis_admin --admin_password='fixture-admin-ci-only' --admin_email=admin@example.test --skip-email
          mkdir -p "$root/wp-content/plugins/aegis-verify"
          cp integrations/wordpress/aegis-verify/aegis-verify.php "$root/wp-content/plugins/aegis-verify/"
          echo "AEGIS_WORDPRESS_ROOT=$root" >> "$GITHUB_ENV"
      - name: Execute real WordPress plugin acceptance
        run: |
          if ! php tests/wordpress_runtime.php; then
            echo 'Isolated WordPress bootstrap diagnostic:'
            test ! -f "$AEGIS_WORDPRESS_ROOT/wp-content/debug.log" || tail -n 80 "$AEGIS_WORDPRESS_ROOT/wp-content/debug.log"
            exit 1
          fi

  public-repository-history:
    # This detects selected historical secret indicators before publishing code.
    # Passing is NOT full privacy/secret review or production authorization.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify historical exposure guard with isolated fixtures
        run: python -m unittest discover -s tests -p 'test_public_repository_audit.py' -v
      - name: Examine all reachable Git history before public visibility
        run: python scripts/check_public_repo_history.py

  predeploy-ci-evidence:
    # Configure as a required branch-protection check after reviewing CI.
    # This checks the disposable CI environment, NOT a live production release.
    if: ${{ always() }}
    needs: [backend, web, postgres-migrations, integrated-postgres-redis, browser-health, browser-smoke, native-runtime, wordpress-runtime, public-repository-history]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Oracle protected rollout shell syntax
        run: bash -n scripts/oci-guarded-backend-rollout.sh
      - name: Validate final Production gateway Caddy syntax and operator safety script
        run: |
          set -euo pipefail
          bash -n scripts/oci-production-gateway.sh
          bash -n scripts/oci-rotate-production-gateway.sh
          bash -n scripts/oci-v1-backend-rollout.sh
          docker run --rm -e AEGIS_PRODUCTION_GATEWAY_KEY=ci-only-placeholder-not-for-any-production-use-123456789012345678901234567890 \
            -v "$PWD/infrastructure/deployment/Caddyfile.production-gated:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Require all pre-deployment test jobs to succeed
        env:
          AEGIS_CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/validate_ci_needs.py
