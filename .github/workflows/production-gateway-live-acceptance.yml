name: production-gateway-live-acceptance
on:
  workflow_dispatch:
  # Scheduled checks run only after this release is approved and merged into
  # the default branch; they have NO write access and send no customer requests.
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [release/aegis-v1-final]
    paths:
      - .github/workflows/production-gateway-live-acceptance.yml
      - scripts/oci-live-web-smoke.sh
      - apps/web/e2e/production-live.spec.ts
      - apps/web/app/console/GuestAuth.tsx
      - apps/web/app/console/FirebasePanel.tsx
      - apps/web/app/console/page.tsx
      - apps/web/app/globals.css
permissions:
  contents: read
concurrency:
  group: aegis-live-production-smoke
  cancel-in-progress: true
jobs:
  production-safe-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check production HTTP behavior without secrets or real user data
        run: bash scripts/oci-live-web-smoke.sh
      - name: Verify public Firebase web-config readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 --retry 2 \
            https://aegis-pentest-eg.vercel.app/api/auth/firebase/config \
            | python3 -c 'import json,sys; result=json.load(sys.stdin); assert result.get("enabled") is True, "Firebase web identity is not enabled"; cfg=result.get("config",{}); assert cfg.get("projectId") and cfg.get("appId") and cfg.get("apiKey"), "Firebase public web settings incomplete"; print("AEGIS_FIREBASE_PUBLIC_CONFIG_READY")'
      - name: Document scope
        run: |
          echo 'This workflow performs only read-only checks and malformed-JSON auth requests.' 
          echo 'It does not create accounts, send email, scan websites, or validate real user sessions.'
  production-live-browser:
    # Hourly monitoring is HTTP-only to avoid browser-install CPU/cost.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Live production desktop/mobile guest and Arabic/Google UI acceptance
        env:
          E2E_BASE_URL: https://aegis-pentest-eg.vercel.app
        run: npx playwright test e2e/production-live.spec.ts --project=desktop --project=mobile --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-live-browser-failure-evidence
          path: apps/web/test-results/
