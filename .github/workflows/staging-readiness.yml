name: staging-readiness
# Read-only checks; manually run only after deploying an explicitly owned staging stack.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-readiness
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging
    env:
      AEGIS_STAGING_WEB_URL: ${{ vars.AEGIS_STAGING_WEB_URL }}
      AEGIS_STAGING_API_URL: ${{ vars.AEGIS_STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install bounded HTTPS smoke dependency
        run: python -m pip install httpx==0.28.1
      - name: Check explicit staging endpoints (GET only, no login or scans)
        run: python scripts/verify_cloud_staging.py
